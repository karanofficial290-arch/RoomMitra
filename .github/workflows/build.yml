name: Build RoomMitra app

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 16 SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore signing key (from repository secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "RM_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing key found - release files will be signed."
          else
            echo "::warning::KEYSTORE_BASE64 secret missing - only the test APK will be usable."
          fi

      - name: Build
        env:
          RM_STORE_PASS: ${{ secrets.RM_STORE_PASS }}
          RM_KEY_PASS: ${{ secrets.RM_KEY_PASS }}
          RM_KEY_ALIAS: ${{ secrets.RM_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Collect files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/RoomMitra-test.apk
          cp app/build/outputs/bundle/release/app-release.aab out/RoomMitra-playstore.aab
          cp app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v5
        with:
          name: RoomMitra-build-${{ github.run_number }}
          path: out/
