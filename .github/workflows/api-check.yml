name: Live backend check

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'app/src/main/assets/www/**', '.github/workflows/api-check.yml' ]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Talk to Supabase like the app does
        run: |
          URL=$(grep -oP "RM_SUPABASE_URL = '\K[^']+" app/src/main/assets/www/data.js)
          KEY=$(grep -oP "RM_SUPABASE_KEY = '\K[^']+" app/src/main/assets/www/data.js)
          fail=0
          LCOLS=$(grep -oP "const LCOLS = '\K[^']+" app/src/main/assets/www/app.js)
          code() { curl -s -o /tmp/body -w "%{http_code}" "$@"; }
          c=$(code "$URL/rest/v1/app_config?select=key,value" -H "apikey: $KEY"); echo "::notice::config: $c $(cat /tmp/body)"
          [ "$c" = 200 ] && grep -q premium_enabled /tmp/body || fail=1
          c=$(code "$URL/rest/v1/plans?select=code,price_inr" -H "apikey: $KEY"); echo "::notice::plans: $c"; [ "$c" = 200 ] || fail=1
          c=$(code "$URL/rest/v1/listings?select=id,title,price,deposit,lat_pub,review,rented,owner:profiles!listings_owner_id_fkey(name,avatar_url,created_at,premium_until,bio)&city=eq.Nahan&status=eq.active&review=eq.approved&limit=5" -H "apikey: $KEY"); echo "::notice::listings: $c"; [ "$c" = 200 ] || fail=1
          c=$(code "$URL/rest/v1/listings?select=contact_phone,address_full,lat" -H "apikey: $KEY"); echo "::notice::read private listing fields (must be blocked): $c"; [ "$c" -ge 400 ] || fail=1
          c=$(code -X POST "$URL/rest/v1/rpc/get_contact" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"lid":"00000000-0000-0000-0000-000000000000"}'); echo "::notice::anon get_contact (must be blocked): $c"; [ "$c" -ge 400 ] || fail=1
          c=$(code -X POST "$URL/rest/v1/listings" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"title":"hack"}'); echo "::notice::anon insert (must be blocked): $c"; [ "$c" -ge 400 ] || fail=1
          c=$(code "$URL/rest/v1/profiles?select=phone" -H "apikey: $KEY"); echo "::notice::read phones (must be blocked): $c"; [ "$c" -ge 400 ] || fail=1
          c=$(code "$URL/rest/v1/messages?select=*" -H "apikey: $KEY"); echo "::notice::anon messages: $c $(head -c 60 /tmp/body)"; [ "$c" -ge 400 ] || [ "$(cat /tmp/body)" = "[]" ] || fail=1
          c=$(code "$URL/auth/v1/settings" -H "apikey: $KEY"); echo "::notice::auth settings: $c"; [ "$c" = 200 ] || fail=1
          c=$(code -X OPTIONS "$URL/rest/v1/listings" -H "Origin: null" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: apikey"); echo "::notice::CORS preflight for app (origin null): $c"
          c=$(code "$URL/rest/v1/listings?select=$LCOLS,owner:profiles!listings_owner_id_fkey(name,avatar_url,created_at,premium_until)&status=eq.active&review=eq.approved&rented=is.false&limit=3" -H "apikey: $KEY"); echo "::warning::app exact listing query: $c $(head -c 80 /tmp/body)"; [ "$c" = 200 ] || fail=1
          c=$(code "$URL/rest/v1/profiles?select=id,name,avatar_url,bio,created_at,premium_until,city&limit=1" -H "apikey: $KEY"); echo "::warning::owner profile query: $c"; [ "$c" = 200 ] || fail=1
          exit $fail
