name: Fetch vendor libraries
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/vendor.yml' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - name: Download Leaflet 1.9.4
        run: |
          mkdir -p v/leaflet/images && cd v/leaflet
          for f in leaflet.js leaflet.css images/marker-icon.png images/marker-icon-2x.png images/marker-shadow.png images/layers.png images/layers-2x.png; do
            curl -fsSL "https://unpkg.com/leaflet@1.9.4/dist/$f" -o "$f"
          done
          ls -laR
      - name: Save to "vendor" branch
        run: |
          cd v
          git init -q -b vendor
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Leaflet 1.9.4"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" vendor
